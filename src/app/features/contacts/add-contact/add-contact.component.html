<div class="modal-header">
  <h4 class="modal-title">{{ formTitle }}</h4>
  <button
    type="button"
    class="btn-close"
    aria-label="Close"
    (click)="activeModal.dismiss()"
  ></button>
</div>

<form [formGroup]="contactForm" (ngSubmit)="onSubmit()">
  <div class="modal-body">
    <!-- Basic Information -->
    <div class="form-section">
      <h6 class="section-title">Basic Information</h6>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label"
            >First Name <span class="text-danger">*</span></label
          >
          <input
            type="text"
            class="form-control"
            formControlName="firstName"
            [class.is-invalid]="isFieldInvalid('firstName')"
            placeholder="Enter first name"
          />
          <div class="invalid-feedback" *ngIf="isFieldInvalid('firstName')">
            {{ getFieldError('firstName') }}
          </div>
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label"
            >Last Name <span class="text-danger">*</span></label
          >
          <input
            type="text"
            class="form-control"
            formControlName="lastName"
            [class.is-invalid]="isFieldInvalid('lastName')"
            placeholder="Enter last name"
          />
          <div class="invalid-feedback" *ngIf="isFieldInvalid('lastName')">
            {{ getFieldError('lastName') }}
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label"
            >Email <span class="text-danger">*</span></label
          >
          <input
            type="email"
            class="form-control"
            formControlName="email"
            [class.is-invalid]="isFieldInvalid('email')"
            placeholder="Enter email address"
          />
          <div class="invalid-feedback" *ngIf="isFieldInvalid('email')">
            {{ getFieldError('email') }}
          </div>
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label">Company</label>
          <select class="form-select" formControlName="companyId">
            <option value="">Select a company...</option>
            <option *ngFor="let company of companies" [value]="company.id">
              {{ company.name }}
            </option>
          </select>
        </div>
      </div>
    </div>

    <!-- Contact Information -->
    <div class="form-section">
      <h6 class="section-title">Contact Information</h6>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Mobile Phone</label>
          <input
            type="tel"
            class="form-control"
            formControlName="phoneMobile"
            [class.is-invalid]="isFieldInvalid('phoneMobile')"
            placeholder="+1 (555) 123-4567"
          />
          <div class="invalid-feedback" *ngIf="isFieldInvalid('phoneMobile')">
            {{ getFieldError('phoneMobile') }}
          </div>
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label">Office Phone</label>
          <input
            type="tel"
            class="form-control"
            formControlName="phoneOffice"
            [class.is-invalid]="isFieldInvalid('phoneOffice')"
            placeholder="+1 (555) 987-6543"
          />
          <div class="invalid-feedback" *ngIf="isFieldInvalid('phoneOffice')">
            {{ getFieldError('phoneOffice') }}
          </div>
        </div>
      </div>
    </div>

    <!-- Professional Information -->
    <div class="form-section">
      <h6 class="section-title">Professional Information</h6>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Job Title</label>
          <input
            type="text"
            class="form-control"
            formControlName="jobTitle"
            placeholder="e.g., Sales Manager"
          />
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label">Department</label>
          <input
            type="text"
            class="form-control"
            formControlName="department"
            placeholder="e.g., Sales"
          />
        </div>
      </div>
    </div>

    <!-- Lead Information -->
    <div class="form-section">
      <h6 class="section-title">Lead Information</h6>

      <div class="row">
        <div class="col-md-4 mb-3">
          <label class="form-label">Lead Source</label>
          <select class="form-select" formControlName="leadSource">
            <option *ngFor="let source of leadSources" [value]="source">
              {{ source }}
            </option>
          </select>
        </div>

        <div class="col-md-4 mb-3">
          <label class="form-label">Lead Status</label>
          <select class="form-select" formControlName="leadStatus">
            <option *ngFor="let status of leadStatuses" [value]="status">
              {{ status }}
            </option>
          </select>
        </div>

        <div class="col-md-4 mb-3">
          <label class="form-label">Rating</label>
          <select class="form-select" formControlName="rating">
            <option [value]="5">⭐⭐⭐⭐⭐ Hot Lead</option>
            <option [value]="4">⭐⭐⭐⭐ Warm Lead</option>
            <option [value]="3">⭐⭐⭐ Neutral</option>
            <option [value]="2">⭐⭐ Cold</option>
            <option [value]="1">⭐ Not Interested</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Address Information -->
    <div class="form-section">
      <h6 class="section-title">Address</h6>

      <div class="mb-3">
        <label class="form-label">Street Address</label>
        <input
          type="text"
          class="form-control"
          formControlName="address"
          placeholder="Street address"
        />
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">City</label>
          <input
            type="text"
            class="form-control"
            formControlName="city"
            placeholder="City"
          />
        </div>

        <div class="col-md-3 mb-3">
          <label class="form-label">State</label>
          <input
            type="text"
            class="form-control"
            formControlName="state"
            placeholder="State"
          />
        </div>

        <div class="col-md-3 mb-3">
          <label class="form-label">Zip Code</label>
          <input
            type="text"
            class="form-control"
            formControlName="zipCode"
            placeholder="Zip"
          />
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Country</label>
        <input
          type="text"
          class="form-control"
          formControlName="country"
          placeholder="Country"
        />
      </div>
    </div>
  </div>

  <!-- Modal Footer -->
  <div class="modal-footer">
    <button
      type="button"
      class="btn btn-outline-secondary"
      (click)="activeModal.dismiss()"
    >
      Cancel
    </button>
    <button
      type="submit"
      class="btn btn-primary"
      [disabled]="contactForm.invalid || loading"
    >
      <span *ngIf="!loading">
        <i class="fas fa-save me-2"></i>{{ contactToEdit ? 'Update Contact' : 'Create Contact' }}
      </span>
      <span *ngIf="loading">
        <span
          class="spinner-border spinner-border-sm me-2"
          role="status"
          aria-hidden="true"
        ></span>
        Saving...
      </span>
    </button>
  </div>
</form>
