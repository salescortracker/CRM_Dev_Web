<div class="container-fluid mt-4">
  <div class="card shadow-sm">
    <!-- HEADER -->
    <div class="card-header d-flex justify-content-between align-items-center bg-success text-white">
      <h5 class="mb-0 fw-semibold">System Settings</h5>
      <button class="btn btn-outline-light btn-sm" (click)="goBack()">Back</button>
    </div>

    <!-- CONTENT -->
    <div class="card-body">
      <form #settingsForm="ngForm">
        <div class="row g-3">
          <!-- APP NAME -->
          <div class="col-md-6">
            <label class="form-label">Application Name</label>
            <input type="text" class="form-control"
                   name="appName"
                   [(ngModel)]="settings.appName">
          </div>

          <!-- APP VERSION -->
          <div class="col-md-6">
            <label class="form-label">Version</label>
            <input type="text" class="form-control"
                   name="appVersion"
                   [(ngModel)]="settings.appVersion"
                   disabled>
          </div>

          <!-- MAX LOGIN ATTEMPTS -->
          <div class="col-md-6">
            <label class="form-label">Max Login Attempts</label>
            <input type="number" class="form-control"
                   name="maxLoginAttempts"
                   [(ngModel)]="settings.maxLoginAttempts"
                   min="1"
                   max="10">
          </div>

          <!-- SESSION TIMEOUT -->
          <div class="col-md-6">
            <label class="form-label">Session Timeout (minutes)</label>
            <input type="number" class="form-control"
                   name="sessionTimeout"
                   [(ngModel)]="settings.sessionTimeout"
                   min="5"
                   max="480">
          </div>

          <!-- NOTIFICATIONS -->
          <div class="col-md-6">
            <label class="form-check-label">
              <input type="checkbox" class="form-check-input"
                     name="enableNotifications"
                     [(ngModel)]="settings.enableNotifications">
              Enable Notifications
            </label>
          </div>

          <!-- TWO FACTOR -->
          <div class="col-md-6">
            <label class="form-check-label">
              <input type="checkbox" class="form-check-input"
                     name="enableTwoFactor"
                     [(ngModel)]="settings.enableTwoFactor">
              Enable Two-Factor Authentication
            </label>
          </div>
        </div>

        <!-- ACTIONS -->
        <div class="mt-4 text-end">
          <button type="button" class="btn btn-outline-secondary me-2" (click)="resetSettings()">
            Reset to Defaults
          </button>

          <button type="button"
                  class="btn btn-success"
                  (click)="saveSettings()">
            Save Settings
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
