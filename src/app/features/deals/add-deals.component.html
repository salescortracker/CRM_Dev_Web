<div class="modal-header">
  <h4 class="modal-title">{{ formTitle }}</h4>
  <button
    type="button"
    class="btn-close"
    aria-label="Close"
    (click)="closeModal()"
  ></button>
</div>

<form [formGroup]="dealForm" (ngSubmit)="onSubmit()">
  <div class="modal-body">
    <!-- Deal Information -->
    <div class="form-section">
      <h6 class="section-title">Deal Information</h6>

      <div class="mb-3">
        <label class="form-label"
          >Deal Name <span class="text-danger">*</span></label
        >
        <input
          type="text"
          class="form-control"
          formControlName="name"
          [class.is-invalid]="isFieldInvalid('name')"
          placeholder="Enter deal name"
        />
        <div class="invalid-feedback" *ngIf="isFieldInvalid('name')">
          {{ getFieldError('name') }}
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label"
            >Company <span class="text-danger">*</span></label
          >
          <select
            class="form-select"
            formControlName="companyId"
            [class.is-invalid]="isFieldInvalid('companyId')"
          >
            <option value="">Select a company...</option>
            <option *ngFor="let company of companies" [value]="company.id">
              {{ company.name }}
            </option>
          </select>
          <div class="invalid-feedback" *ngIf="isFieldInvalid('companyId')">
            {{ getFieldError('companyId') }}
          </div>
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label">Contact</label>
          <select class="form-select" formControlName="contactId">
            <option value="">Select a contact...</option>
            <option *ngFor="let contact of contacts" [value]="contact.id">
              {{ contact.firstName }} {{ contact.lastName }}
            </option>
          </select>
        </div>
      </div>
    </div>

    <!-- Deal Amount -->
    <div class="form-section">
      <h6 class="section-title">Deal Amount</h6>

      <div class="row">
        <div class="col-md-8 mb-3">
          <label class="form-label"
            >Amount <span class="text-danger">*</span></label
          >
          <input
            type="number"
            class="form-control"
            formControlName="amount"
            [class.is-invalid]="isFieldInvalid('amount')"
            placeholder="Enter deal amount"
            min="0"
            step="1000"
          />
          <div class="invalid-feedback" *ngIf="isFieldInvalid('amount')">
            {{ getFieldError('amount') }}
          </div>
        </div>

        <div class="col-md-4 mb-3">
          <label class="form-label">Currency</label>
          <select class="form-select" formControlName="currency">
            <option *ngFor="let curr of currencies" [value]="curr">
              {{ curr }}
            </option>
          </select>
        </div>
      </div>
    </div>

    <!-- Deal Status -->
    <div class="form-section">
      <h6 class="section-title">Deal Status</h6>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Stage</label>
          <select class="form-select" formControlName="stage">
            <option *ngFor="let stage of dealStages" [value]="stage">
              {{ stage }}
            </option>
          </select>
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label">Status</label>
          <select class="form-select" formControlName="status">
            <option *ngFor="let status of dealStatuses" [value]="status.value">
              {{ status.label }}
            </option>
          </select>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Win Probability (%)</label>
        <input
          type="range"
          class="form-range"
          min="0"
          max="100"
          formControlName="probability"
        />
        <small class="text-muted"
          >Probability: {{ dealForm.get('probability')?.value }}%</small
        >
      </div>
    </div>

    <!-- Deal Dates -->
    <div class="form-section">
      <h6 class="section-title">Important Dates</h6>

      <div class="mb-3">
        <label class="form-label">Expected Close Date</label>
        <input
          type="date"
          class="form-control"
          formControlName="expectedCloseDate"
        />
      </div>
    </div>

    <!-- Deal Description -->
    <div class="form-section">
      <h6 class="section-title">Description</h6>

      <div class="mb-3">
        <label class="form-label">Notes</label>
        <textarea
          class="form-control"
          formControlName="description"
          rows="3"
          placeholder="Add any additional notes about this deal..."
        ></textarea>
      </div>
    </div>
  </div>

  <!-- Modal Footer -->
  <div class="modal-footer">
    <button
      type="button"
      class="btn btn-outline-secondary"
      (click)="closeModal()"
    >
      Cancel
    </button>
    <button
      type="submit"
      class="btn btn-primary"
      [disabled]="dealForm.invalid || loading"
    >
      <span *ngIf="!loading">
        <i class="fas fa-save me-2"></i>{{ existingDeal ? 'Update Deal' : 'Create Deal' }}
      </span>
      <span *ngIf="loading">
        <span
          class="spinner-border spinner-border-sm me-2"
          role="status"
          aria-hidden="true"
        ></span>
        Saving...
      </span>
    </button>
  </div>
</form>
