<div class="container-fluid py-4">
  <div class="row mb-4">
    <div class="col-md-8">
      <h1 class="mb-1">Pipeline</h1>
      <p class="text-muted">Monitor deal stages and move opportunities through the funnel.</p>
    </div>
    <div class="col-md-4 text-end">
      <button class="btn btn-primary">
        <i class="fas fa-plus me-2"></i>New Opportunity
      </button>
    </div>
  </div>

  <div class="row g-3">
    <div class="col-xl-4 col-md-6" *ngFor="let stage of stages">
      <div class="card pipeline-card">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-start">
            <div>
              <h5 class="card-title">{{ stage.name }}</h5>
              <p class="text-muted mb-2">{{ stage.count }} deals</p>
              <div class="pipeline-value">{{ stage.value | currency }}</div>
            </div>
            <div class="pipeline-badge" [style.background]="stage.color">
              {{ stage.progress }}%
            </div>
          </div>

          <div class="progress mb-3">
            <div
              class="progress-bar"
              role="progressbar"
              [style.width.%]="stage.progress"
              [style.background]="stage.color"
              [attr.aria-valuenow]="stage.progress"
              aria-valuemin="0"
              aria-valuemax="100"
            ></div>
          </div>

          <div class="d-flex gap-2">
            <button
              class="btn btn-sm btn-outline-secondary"
              (click)="moveStage(stage, 'previous')"
            >
              <i class="fas fa-arrow-left"></i>
            </button>
            <button
              class="btn btn-sm btn-outline-primary"
              (click)="moveStage(stage, 'next')"
            >
              <i class="fas fa-arrow-right"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
